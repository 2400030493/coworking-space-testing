
name: Coworking Space CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Check Python syntax
        run: python -m py_compile test_coworking.py

      - name: Run unit tests
        run: python -m pytest -v test_coworking.py
